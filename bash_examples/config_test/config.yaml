dataset:
  dataset: 'synthetic'  
  path: none
  
model:
  restart: false
  retrain: true

ts:
  name: 's1'
  version: 1
  enrich: ['hour']
  use_covariates: true
  use_future_covariates: true
  #sampler_weights: fake_columns
  sampler_weights: null
  check: true #add the target to past covariates (for some models it is mandatory)

scheduler_config:
  gamma: 1.0
  step_size: 100

optim_config:
  lr: 0.00001
  weight_decay: 0.001

model_configs:
  past_steps: 96
  future_steps: 8
  quantiles: []
  # dataset dependent part
  past_channels : null 
  future_channels : null
  embs_past: null 
  embs_fut: null
  out_channels: null
  # prediction_channel_indices: null
  # exogenous_channel_indices_cont: null
  # exogenous_channel_indices_cat: null


stack:
  dirpath: null ##leave it null

split_params:
  perc_train: 0.2
  perc_valid: 0.05
  range_train: null
  range_validation: null 
  range_test: null
  shift: 0
  starting_point: null
  skip_step: 1
  past_steps: model_configs@past_steps 
  future_steps: model_configs@future_steps
  scaler: 'StandardScaler()' ## or sklearn.preprocessing.StandardScaler()
  
train_config:
  dirpath: tmp
  num_workers: 15
  auto_lr_find: false
  devices: [0]                   
  seed: 42   
  max_epochs: 20
  patience: 1
  #continual: null
  continual:
    continual_learning_fraction: 0.5 ## last half used for continual learning
    batch_size: 8 ##smaller
    max_epochs: 10 ## if streaming online learning otherwise  betwween 5 and 20
    lr: 0.00001 #smaller?

inference:
  output_path: tmp
  load_last: true
  batch_size: 200 
  num_workers: 1
  set: "validation"
  rescaling: true

defaults:
  - _self_
  - architecture: null #architecture
  - stack: null        #stack generalization
  - override hydra/launcher: joblib

hydra:
  launcher:
    n_jobs:  2
    verbose: 1
    pre_dispatch: 2
    batch_size: 2

  output_subdir: null 
  sweeper:
    params:
      architecture: glob(*) #architecture
