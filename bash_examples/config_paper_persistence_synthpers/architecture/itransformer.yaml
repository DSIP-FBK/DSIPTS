# @package _global_

model:
  type: 'itransformer'
  retrain: true
  restart: false
ts:
  name: 'persistent_snr0.5'
  version: 1
  enrich: []
  use_covariates: true
  #use_future_covariates: false
  silly: false

model_configs:
  use_classical_positional_encoder: true 
  emb_dim: 4 
  reduction_mode: mean 
  d_model: 128
  n_head: 2
  hidden_size: ${model_configs.d_model} ##tied to d_model so the tuning sweep is 1-D in size
  dropout_rate: 0.2   ##was 0.0: stage 1 (10-06) overfit from epoch 0 in 12/14 runs
  n_layer_decoder: 2
  use_norm: true
  optim: torch.optim.Adam
  persistence_weight: 1
  loss_type: 'l1'
  persistence_anchor: 'last'   ##'last' (persistence) or 'mean' (past window mean)
  activation: torch.nn.ReLU
  class_strategy: 'projection' #projection/average/cls_token
  quantiles: []
train_config:
  batch_size: 64
  max_epochs: 800
  auto_lr_find: false
  patience: 200
optim_config:
  lr: 0.0001
  weight_decay: 0.0001 ##was 1e-6, see dropout_rate