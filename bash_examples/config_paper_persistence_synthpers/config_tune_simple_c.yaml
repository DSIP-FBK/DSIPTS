## stage 1g (2026-10-12): Simple, dropout 0, WITH last-value centering (center_last=true), l1 only.
## 1f (no centering) failed: MASE 1.2-2.1, amplitude 2-4x the oracle -- the MLP cannot carry the random-walk level
## (y spans +-100, lag-1 RMSE ~4 vs persistence ~1.3). center_last is in the sweep so the run names differ from 1f.
## Gate: SNR 1 lags 1-24 test MASE ~ ridge 0.705 (oracle 0.645, NLinear 0.908) AND D < D_opt 0.74 (still hugs).
##   python train.py --config-dir=config_paper_persistence_synthpers --config-name=config_tune_simple_c ts.name=persistent_snr1 -m
defaults:
  - config_abacus
  - _self_

hydra:
  sweeper:
    params:
      architecture: simple
      model_configs.loss_type: l1
      model_configs.center_last: true
      model_configs.hidden_size: 128,512
      optim_config.weight_decay: 0.00001,0.0001
      optim_config.lr: 0.0001,0.001
