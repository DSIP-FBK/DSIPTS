## stage 1b (2026-10-07): regularization tuning with l1 only, then freeze the architecture.
## Stage 1 (lr sweep, d_model 128, dropout 0) overfit from epoch 0 and lost to persistence
## even at SNR 0.1, where persistence is the optimum. Target: l1 at SNR 0.1 reaches MASE ~1.0.
## Tune on SNR 0.1 (persistence-optimal) and SNR 1 (signal recoverable). 12 jobs:
##   python train.py --config-dir=config_paper_persistence_synthpers --config-name=config_tune -m
defaults:
  - config_abacus
  - _self_

hydra:
  sweeper:
    params:
      architecture: itransformer
      ts.name: persistent_snr0.1,persistent_snr1
      model_configs.loss_type: l1
      model_configs.d_model: 32,64,128
      model_configs.dropout_rate: 0.1,0.3
