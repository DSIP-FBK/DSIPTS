models: config_paper_persistence_electricity
#models: ['config_used/linear.yaml']
dirpath: /storage3/DSIP/agobbi/Projects/ExpTS/paper_persistence_v3_electricity

set: 'test'
name: 'electricity'
rescaling: true

defaults:
  - _self_
  - override hydra/launcher: submitit_slurm 


hydra:
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    timeout_min: 6000
    partition: gpu-V100
    mem_gb: 32
    nodes: 1
    gres: shard:2   ## 2 shards x 4GB VRAM
    name: ${hydra.job.name}
    _target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
    setup:
      - source /storage3/DSIP/agobbi/Projects/timeseries/dsipts/.venv/bin/activate  
