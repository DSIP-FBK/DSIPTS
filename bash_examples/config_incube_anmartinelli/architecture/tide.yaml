# @package _global_

model:
  type: 'tide'
  retrain: true
ts:
  name: 'test'
  version: 1
  enrich: ['dow','hour']
  use_covariates: true

model_configs:
  d_model: 16
  hidden_size: 64
  num_added_encoder_head: 4
  num_added_decoder_head: 4
  quantiles: [0.1, 0.5, 0.9]
  optim: torch.optim.Adam
  dropout_rate: 0.2
  persistence_weight: 0.010
  loss_type: 'l1'

train_config:
  batch_size: 128
  max_epochs: 2000
            
