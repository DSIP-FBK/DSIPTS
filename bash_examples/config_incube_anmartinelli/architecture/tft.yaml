# @package _global_

model:
  type: 'tft'
  retrain: true
ts:
  name: 'test'
  version: 1
  enrich: ['dow','hour']
  use_covariates: false

model_configs:
  d_model: 32
  num_layers_RNN: 8
  d_head: 16
  n_head: 4
  optim: torch.optim.Adam
  dropout_rate: 0.2
  persistence_weight: 0.010
  loss_type: 'l1'

train_config:
  batch_size: 128
  max_epochs: 2000
            
