# @package _global_

model:
  type: 'diffusion'
  retrain: true
ts:
  name: 'test'
  version: 1
  enrich: ['dow','hour']
  use_covariates: false

model_configs:
  d_model: 128
  learn_var: True
  cosine_alpha: True
  diffusion_steps: 60
  beta: 0.03
  gamma: 0.005
  n_layers_RNN: 4
  d_head: 64
  n_head: 5
  dropout_rate: 0.0
  activation: 'torch.nn.GELU'
  subnet: 3
  perc_subnet_learning_for_step: 0.15
  optim: torch.optim.Adam
  persistence_weight: 0.010
  loss_type: 'l1'

train_config:
  batch_size: 128
  max_epochs: 150
            
