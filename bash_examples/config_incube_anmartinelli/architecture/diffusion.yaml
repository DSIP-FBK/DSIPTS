# @package _global_

model:
  type: 'diffusion'
  retrain: true
ts:
  name: 'test'
  version: 1
  enrich: ['dow','hour']
  use_covariates: false
  silly: True

model_configs:
  d_model: 32
  learn_var: True
  cosine_alpha: True
  diffusion_steps: 35
  beta: 0.03
  gamma: 0.5
  n_layers_RNN: 6
  d_head: 16
  n_head: 5
  dropout_rate: 0.5
  activation: 'torch.nn.GELU'
  subnet: 3
  perc_subnet_learning_for_step: 0.15
  optim: torch.optim.Adam
  persistence_weight: 0.010
  loss_type: 'l1'

train_config:
  batch_size: 128
  max_epochs: 150
            
